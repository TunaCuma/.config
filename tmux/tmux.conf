# Clean terminal settings - remove conflicting lines
set-option -g default-terminal "xterm-256color"
set -ga terminal-overrides ",xterm-256color:Tc"
set -s escape-time 0

# Set default shell to zsh for new windows
set-option -g default-shell /bin/zsh

# Enable extended keys and focus events
set -s extended-keys on
set -s focus-events on
set -as terminal-features 'xterm*:extkeys'

# But override for the first window in new sessions
set-hook -g session-created 'select-window -t 1; respawn-pane -k "/bin/bash"'

unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

set -g status-style 'bg=#333333 fg=#5eacd3'
set -g status-interval 1
set -g status-right '#[fg=#e5c07b]#(bash ~/Code/leetcode/scripts/timer.sh status) #[default]%H:%M %d-%b'
set -g status-right-length 50
bind r source-file ~/.config/tmux/tmux.conf
set -g base-index 1

# Allow passthrough for inline images
set -gq allow-passthrough on
# Optional: Hide/show images automatically when switching windows
set -g visual-activity off

set-window-option -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'xclip -in -selection clipboard'
setw -g mouse on

# REMOVE this line as it conflicts with extended keys
# set -g xterm-keys on

# Explicit binding for Kitty's Ctrl+i sequence
# bind-key -n '\x1b[73;5u' send-keys C-i

# vim-like pane switching
bind -r ^ last-window
bind -r k select-pane -U
bind -r j select-pane -D
bind -r h select-pane -L
bind -r l select-pane -R

# forget the find window.  That is for chumps
bind-key -r f run-shell "tmux neww ~/.local/bin/tmux-sessionizer"
bind-key -r b run-shell "tmux neww ~/.local/bin/tmux-books-pdfizer"
bind-key -r g run-shell "tmux neww ~/.local/bin/tmux-pdfizer"

bind-key Space switch-client -l

# Update the key bindings in your ~/.tmux.conf to suppress output
bind-key -r D run-shell "~/.local/bin/tmux-sessionizer ~/Desktop/obsidian-vault"
bind-key -r J run-shell "~/.local/bin/tmux-sessionizer ~/Personal"
bind-key -r K run-shell "~/.local/bin/tmux-sessionizer ~/.config"
bind-key -r L run-shell "~/.local/bin/tmux-sessionizer ~/.local/bin"
bind-key -r P run-shell "~/.local/bin/tmux-sessionizer ~/Personal/Python"
bind-key -r C run-shell "~/.local/bin/tmux-sessionizer ~/Personal/C"
bind-key -r I run-shell "~/.local/bin/tmux-sessionizer ~/"
bind-key -r F run-shell "~/.local/bin/tmux-sessionizer ~/Code/udemy-django"
bind-key -r S run-shell "~/.local/bin/tmux-sessionizer ~/Code/cdp"
bind-key -r A run-shell "~/.local/bin/tmux-sessionizer ~/Code/service-sms-notifier"
bind-key -r W run-shell "~/.local/bin/tmux-sessionizer ~/Code/service-comms-gateway"
bind-key -r Z run-shell "~/.local/bin/tmux-sessionizer ~/Code/services-protobuf-resources"
bind-key -r E run-shell "~/.local/bin/tmux-sessionizer ~/Code/dp-data-access-policy-sync"
bind-key -r O run-shell "~/.local/bin/tmux-sessionizer ~/Code/DAPS-script"
bind-key -r N run-shell "~/.local/bin/tmux-sessionizer ~/.config/nvim"
bind-key -r X run-shell "~/.local/bin/tmux-sessionizer ~/Code/leetcode"
bind-key -r '}' run-shell "~/.local/bin/tmux-sessionizer ~/.openclaw"

