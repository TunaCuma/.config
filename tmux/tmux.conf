set -ga terminal-overrides ",screen-256color*:Tc"
set-option -g default-terminal "screen-256color"
set -s escape-time 0

unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix
set -g status-style 'bg=#333333 fg=#5eacd3'

bind r source-file ~/.config/tmux/tmux.conf
set -g base-index 1

# Allow passthrough for inline images
set -gq allow-passthrough on

# Optional: Hide/show images automatically when switching windows
set -g visual-activity off

set-window-option -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'xclip -in -selection clipboard'

setw -g mouse on

# vim-like pane switching
bind -r ^ last-window
bind -r k select-pane -U
bind -r j select-pane -D
bind -r h select-pane -L
bind -r l select-pane -R

# forget the find window.  That is for chumps
bind-key -r f run-shell "tmux neww ~/.local/bin/tmux-sessionizer"
bind-key -r b run-shell "tmux neww ~/.local/bin/tmux-books-pdfizer"
bind-key -r g run-shell "tmux neww ~/.local/bin/tmux-pdfizer"

# Update the key bindings in your ~/.tmux.conf to suppress output
bind-key -r D run-shell "/usr/local/bin/tmuxp load -y obsidian-vault > /dev/null 2>&1" 
bind-key -r J run-shell "/usr/local/bin/tmuxp load -y personal > /dev/null 2>&1"
bind-key -r K run-shell "/usr/local/bin/tmuxp load -y config > /dev/null 2>&1"
bind-key -r L run-shell "/usr/local/bin/tmuxp load -y local-bin > /dev/null 2>&1"
bind-key -r P run-shell "/usr/local/bin/tmuxp load -y python > /dev/null 2>&1"
bind-key -r I run-shell "/usr/local/bin/tmuxp load -y home > /dev/null 2>&1"
bind-key -r F run-shell "/usr/local/bin/tmuxp load -y monolith > /dev/null 2>&1"
bind-key -r S run-shell "/usr/local/bin/tmuxp load -y cdp > /dev/null 2>&1"
bind-key -r A run-shell "/usr/local/bin/tmuxp load -y sms-notifier > /dev/null 2>&1"
bind-key -r Z run-shell "/usr/local/bin/tmuxp load -y protobuf > /dev/null 2>&1"
bind-key -r E run-shell "/usr/local/bin/tmuxp load -y db-policy > /dev/null 2>&1"
bind-key -r O run-shell "/usr/local/bin/tmuxp load -y idea > /dev/null 2>&1"

